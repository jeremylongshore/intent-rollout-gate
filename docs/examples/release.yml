# Copy to .github/workflows/release.yml in the repository you are gating.
# Pushing a v* tag runs your gates, assembles the Evidence Bundle, and lets
# intent-rollout-gate decide allow or block with your release policy.
# Adoption guide: docs/release-gate.md in jeremylongshore/intent-rollout-gate.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-gate:
    # Pinned by full commit SHA. To move to a newer commit, resolve it with:
    #   gh api repos/jeremylongshore/intent-rollout-gate/commits/main --jq .sha
    uses: jeremylongshore/intent-rollout-gate/.github/workflows/release-gate.yml@cfd970240e8e7ec16aac234f09aaaa97bf272d48 # main after #78
    with:
      policy-path: .github/rollout/release-policy.json
      setup-command: npm ci
      # The emitter defaults to @intentsolutions/audit-harness 1.5.1, refused unless
      # its tarball matches the pinned sha512. To use a newer release, set both:
      # audit-harness-version: <version>
      # audit-harness-integrity: <npm view @intentsolutions/audit-harness@<version> dist.integrity>
      # One command per line; each prints one gate-result JSON envelope.
      gate-commands: |
        npx --no-install audit-harness verify --json
        # Add one line per gate. Anything that prints a gate-result envelope works,
        # including your own scripts: {"gate_id":"<tool>:ci:<gate>","result":"PASS",
        # "input_hash":"sha256:<64 hex>","policy_hash":"sha256:<64 hex>"}

  # Downstream jobs (publish, deploy, GitHub Release) wait on the decision:
  # publish:
  #   needs: [release-gate]
  #   if: needs.release-gate.outputs.decision == 'allow'
