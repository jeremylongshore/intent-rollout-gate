name: Release gate (reusable)

# Reference tag-release gate for repositories that adopt intent-rollout-gate.
# A consumer calls it from its own `on: push: tags: ["v*"]` workflow (copy
# docs/examples/release.yml) and passes three things:
#
#   gate-commands  one shell command per line; each prints ONE gate-result JSON
#                  envelope on stdout (for example `npx audit-harness verify --json`).
#                  A gate may exit non-zero: its verdict travels in the row and the
#                  rollout gate decides. A gate that prints nothing fails the job.
#   policy-path    the release policy JSON in the consumer repo.
#   setup-command  optional toolchain setup run once before the gates.
#
# The job then:
#   0. downloads @intentsolutions/audit-harness from npm and refuses it unless
#      the tarball's sha512 equals the pinned audit-harness-integrity,
#   1. runs every gate and appends its row with
#      `audit-harness emit-evidence --append-to <bundle>` (validated rows,
#      duplicate row ids refused, atomic write),
#   2. runs the rollout gate on the assembled bundle with the release policy,
#   3. uploads the bundle and the policy as the `artifact-name` artifact,
#      whatever the decision.
#
# No secrets are required or read. Permissions: contents: read.
# Every action below is pinned by full commit SHA. The self-test is
# .github/workflows/release-gate-self-test.yml.

on:
  workflow_call:
    inputs:
      gate-commands:
        description: Newline-separated commands; each prints one gate-result JSON envelope on stdout. Blank lines and lines starting with '#' are skipped.
        required: true
        type: string
      policy-path:
        description: Path to the release policy JSON in the calling repository.
        required: true
        type: string
      setup-command:
        description: Optional command run once before the gates (for example `npm ci`).
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version for the setup command and audit-harness.
        required: false
        type: string
        default: "22"
      audit-harness-version:
        description: Exact stable npm version (MAJOR.MINOR.PATCH, no pre-release tag) of @intentsolutions/audit-harness that provides `emit-evidence --append-to` (1.5.1 or later). Changing it requires the matching audit-harness-integrity.
        required: false
        type: string
        default: 1.5.1
      audit-harness-integrity:
        description: npm dist.integrity (sha512-...) of that version's tarball, from `npm view @intentsolutions/audit-harness@<version> dist.integrity`. The downloaded tarball must hash to exactly this value or the job fails before any harness code runs.
        required: false
        type: string
        default: sha512-7TI7i8iKHNwYQ1ZPH8/23Y4Dp7z5ZBBo7HTbgihuCK4e4ZNbiCSpe/vgYRDTS0xhgk2T8mGOYFegTXWKNob8uA== # 1.5.1
      bundle-path:
        description: Where the assembled Evidence Bundle is written.
        required: false
        type: string
        default: evidence/release-bundle.json
      fail-on-block:
        description: true fails the job on a block decision; false reports only.
        required: false
        type: boolean
        default: true
      artifact-name:
        description: Name of the uploaded evidence artifact.
        required: false
        type: string
        default: release-evidence
    outputs:
      decision:
        description: allow or block, from the rollout gate.
        value: ${{ jobs.release-gate.outputs.decision }}
      reasons:
        description: JSON array of blocking reasons (empty on allow).
        value: ${{ jobs.release-gate.outputs.reasons }}

permissions:
  contents: read

jobs:
  release-gate:
    name: Gates, evidence bundle, rollout decision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reasons: ${{ steps.gate.outputs.reasons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Two steps on purpose: the self-test runs the verify step's exact script
      # against a tampered tarball, so the check that guards real releases is the
      # one that is proven to refuse.
      - name: Fetch the audit-harness tarball
        env:
          AUDIT_HARNESS_VERSION: ${{ inputs.audit-harness-version }}
        run: |
          set -euo pipefail
          if [[ ! "$AUDIT_HARNESS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::audit-harness-version must be an exact npm version (for example 1.5.1)"
            exit 1
          fi
          dir="$RUNNER_TEMP/release-gate-audit-harness"
          mkdir -p "$dir"
          # npm pack only downloads the published tarball: nothing is installed and
          # no package script runs. The verify step decides whether it is used.
          npm pack --ignore-scripts --silent --pack-destination "$dir" \
            "@intentsolutions/audit-harness@$AUDIT_HARNESS_VERSION" > /dev/null
          # npm names a scoped package's tarball <scope>-<name>-<version>.tgz.
          tarball="$dir/intentsolutions-audit-harness-$AUDIT_HARNESS_VERSION.tgz"
          [[ -s "$tarball" ]] || { echo "::error::npm pack did not produce $tarball"; exit 1; }
          echo "AUDIT_HARNESS_TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Verify the audit-harness tarball and unpack the evidence emitter
        env:
          AUDIT_HARNESS_VERSION: ${{ inputs.audit-harness-version }}
          AUDIT_HARNESS_INTEGRITY: ${{ inputs.audit-harness-integrity }}
        run: |
          set -euo pipefail
          if [[ ! "$AUDIT_HARNESS_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]]; then
            echo "::error::audit-harness-integrity must be an npm sha512 integrity string (sha512-<base64>)"
            exit 1
          fi
          # The pinned hash is checked here, independently of the registry
          # metadata npm pack trusted, so a substituted tarball cannot pass.
          actual="sha512-$(openssl dgst -sha512 -binary "$AUDIT_HARNESS_TARBALL" | base64 -w0)"
          if [[ "$actual" != "$AUDIT_HARNESS_INTEGRITY" ]]; then
            echo "::error::audit-harness tarball integrity mismatch: expected $AUDIT_HARNESS_INTEGRITY, got $actual"
            exit 1
          fi
          pkg="$RUNNER_TEMP/release-gate-audit-harness/package"
          rm -rf "$pkg"
          mkdir -p "$pkg"
          tar -xzf "$AUDIT_HARNESS_TARBALL" -C "$pkg" --strip-components=1 --no-same-owner
          # The harness has no runtime dependencies, so the unpacked package runs as is.
          got="$(node -p 'const p=require(process.argv[1]); p.name + "@" + p.version' "$pkg/package.json")"
          if [[ "$got" != "@intentsolutions/audit-harness@$AUDIT_HARNESS_VERSION" ]]; then
            echo "::error::verified tarball is $got, not @intentsolutions/audit-harness@$AUDIT_HARNESS_VERSION"
            exit 1
          fi
          emitter="$pkg/bin/audit-harness.js"
          node "$emitter" --version
          echo "EMITTER=$emitter" >> "$GITHUB_ENV"

      - name: Set up the gates' toolchain
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Run the gates and assemble the Evidence Bundle
        env:
          GATE_COMMANDS: ${{ inputs.gate-commands }}
          BUNDLE_PATH: ${{ inputs.bundle-path }}
        run: |
          set -euo pipefail
          rm -f "$BUNDLE_PATH"
          n=0
          while IFS= read -r cmd || [[ -n "$cmd" ]]; do
            trimmed="${cmd#"${cmd%%[![:space:]]*}"}"
            [[ -z "$trimmed" || "$trimmed" == \#* ]] && continue
            n=$((n + 1))
            row="$RUNNER_TEMP/gate-$n.json"
            echo "::group::gate $n: $trimmed"
            ec=0
            bash -o pipefail -c "$trimmed" > "$row" || ec=$?
            echo "gate exit code: $ec (the row's verdict, not this code, feeds the rollout gate)"
            if [[ ! -s "$row" ]]; then
              echo "::error::gate $n printed no gate-result JSON: $trimmed"
              exit 1
            fi
            node "$EMITTER" emit-evidence --append-to "$BUNDLE_PATH" < "$row"
            echo "::endgroup::"
          done <<< "$GATE_COMMANDS"
          if [[ "$n" -eq 0 ]]; then
            echo "::error::gate-commands holds no command"
            exit 1
          fi
          echo "assembled $n row(s) into $BUNDLE_PATH"

      - name: Rollout gate with the release policy
        id: gate
        uses: jeremylongshore/intent-rollout-gate@a6e44951b2e950d250a65e5f5f3dbaf5deb6aab4 # main after #77 (decision library 2.2.0)
        with:
          bundle-path: ${{ inputs.bundle-path }}
          policy-path: ${{ inputs.policy-path }}
          fail-on-block: ${{ inputs.fail-on-block && 'true' || 'false' }}

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.bundle-path }}
            ${{ inputs.policy-path }}
          if-no-files-found: warn
