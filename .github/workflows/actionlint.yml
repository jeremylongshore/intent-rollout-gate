name: Actionlint

on:
  push:
    branches: [main]
  # No `branches:` filter on purpose: with `branches: [main]` a stacked PR whose
  # base is another feature branch gets no checks at all. Push builds stay on main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint .github/workflows/*.yml with rhysd/actionlint
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          reporter: github-check
          level: error
          fail_level: error
