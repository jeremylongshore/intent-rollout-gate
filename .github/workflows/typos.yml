name: Typos

on:
  push:
    branches: [main]
  # No `branches:` filter on purpose: with `branches: [main]` a stacked PR whose
  # base is another feature branch gets no checks at all. Push builds stay on main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Spell-check with crate-ci/typos
        uses: crate-ci/typos@v1.50.2
